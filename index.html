<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FEH</title>
	<link rel= "stylesheet" href="https://cdn,jsdelivr.net/npm/bootsrap@5.3.3/dist/css/bootsrap.min.css">
</head>
<body>

	<div class="container">
		
		<details ontoggle="message()"><summary>Instructions </summary> 
		<i> Enter two numbers then find its answer </i> 
	</details>

	</div>

	<br>

	<form>
		<label>Enter the 1st number:</label>

		<input type ="number" id="num1" placeholder="type here...">
		<br>
		<label> Enter the 2nd number: </label>
		<input type ="number" id="num2" placeholder="type here...">

		<button type="button" onmouseover="plus()"> PLUS </button>

		<span> <h1 id="result"> Result </h1> </span>

	</form>

	<script type="text/javascript">
		function message() {
			alert("try it");
		}

		function plus (){
			var add1 = document.getElementById('num1').value;
			var add2 = document.getElementById('num2').value;
			var sum = Number (add1) + Number (add2);

			document.getElementById('result').innerHTML= 'Answer is' + '' + sum; 
		}
	</script>





	</form>

</body>
</html>
